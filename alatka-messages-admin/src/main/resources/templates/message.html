<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alatka-messages-admin</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/tom-select/dist/css/tom-select.bootstrap5.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-table/dist/bootstrap-table.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/alatka-messages-infra.css}">
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <h5 class="mb-0">报文查询</h5>
            <button class="btn btn-sm btn-outline-secondary"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#cardCollapse"
                    aria-expanded="true"
                    aria-controls="cardCollapse">
                <i class="bi bi-arrows-angle-contract"></i>
            </button>
        </div>
        <div class="card-body collapse show" id="cardCollapse">
            <form id="searchForm" class="row g-3">
                <div class="col-md-3">
                    <label for="type" class="form-label">类型</label>
                    <select class="form-select alk-select-type" id="type" name="type">
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="group" class="form-label">分组</label>
                    <input type="text" class="form-control" id="group" name="group" placeholder="输入分组">
                </div>
                <div class="col-md-3">
                    <label for="code" class="form-label">交易码</label>
                    <input type="text" class="form-control" id="code" name="code" placeholder="输入交易码">
                </div>
                <div class="col-md-3">
                    <label for="kind" class="form-label">种类</label>
                    <select class="form-select alk-select-kind" id="kind" name="kind">
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="remark" class="form-label">描述</label>
                    <input type="text" class="form-control" id="remark" name="remark" placeholder="输入描述">
                </div>
                <div class="col-md-3">
                    <label for="enabled" class="form-label">状态</label>
                    <select class="form-select alk-select-enabled" id="enabled" name="enabled">
                    </select>
                </div>
                <div class="col-12 text-center">
                    <button type="button" class="btn btn-secondary me-2" id="resetButton">
                        <i class="bi bi-arrow-counterclockwise"></i> 重置
                    </button>
                    <button type="button" class="btn btn-primary" id="searchButton">
                        <i class="bi bi-search"></i> 查询
                    </button>
                </div>
            </form>
        </div>
    </div>

    <table id="dataTable"
           data-toggle="table"
           data-method="get"
           data-url="/message/page"
           data-sort-name="id"
           data-sort-order="desc"
           data-striped="true"
           data-pagination="true"
           data-pagination-loop="false"
           data-side-pagination="server"
           data-click-to-select="true"
           data-show-columns="true"
           data-show-button-text="true"
           data-thead-classes="text-center"
           data-maintain-selected="true">
        <thead>
        <tr>
            <th data-radio="true"></th>
            <th data-field="id" data-align="right" data-sortable="true" data-visible="false">ID</th>
            <th data-field="type" data-align="center" data-formatter="typeFormatter">类型</th>
            <th data-field="group" data-align="center">分组</th>
            <th data-field="code" data-align="center" data-sortable="true">交易码</th>
            <th data-field="kind" data-align="center" data-sortable="true" data-formatter="kindFormatter">种类</th>
            <th data-field="holder">实体类</th>
            <th data-field="charset" data-align="center" data-formatter="charsetFormatter">编码</th>
            <th data-field="remark">描述</th>
            <th data-field="enabled" data-align="center" data-formatter="enabledFormatter">状态</th>
        </tr>
        </thead>
    </table>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑报文</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId" name="id">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="editType" class="form-label">类型</label>
                            <select class="form-select alk-select-type" id="editType" name="type" required>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="editGroup" class="form-label">分组</label>
                            <input type="text" class="form-control" id="editGroup" name="group" placeholder="输入分组"
                                   required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="editCode" class="form-label">交易码</label>
                            <input type="text" class="form-control" id="editCode" name="code" placeholder="输入交易码"
                                   required>
                        </div>
                        <div class="col-md-6">
                            <label for="editKind" class="form-label">种类</label>
                            <select class="form-select alk-select-kind" id="editKind" name="kind" required>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="editRemark" class="form-label">描述</label>
                            <input type="text" class="form-control" id="editRemark" name="remark"
                                   placeholder="输入描述" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="editHolder" class="form-label">实体类</label>
                            <input type="text" class="form-control" id="editHolder" name="holder"
                                   placeholder="输入实体类" value="com.alatka.messages.core.holder.MessageHolder">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="editCharset" class="form-label">编码</label>
                            <select class="form-select alk-select-charset" id="editCharset" name="charset">
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="editEnabled" class="form-label">状态</label>
                            <select class="form-select alk-select-enabled" id="editEnabled" name="enabled" required>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveEditBtn">确认</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">删除报文</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除选中的记录？</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="saveDeleteBtn">确认</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="buildModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">部署报文</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="buildForm">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="buildPath" class="form-label">路径</label>
                            <input type="text" class="form-control" id="buildPath" name="path"
                                   aria-describedby="pathDesc" required>
                            <div id="pathDesc" class="form-text">
                                例如：/deploy 或 /fallback 或 /message/build
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="buildUris" class="form-label">uris</label>
                            <textarea class="form-control" rows="3" id="buildUris" name="uris"
                                      aria-describedby="buildUrisDesc" required></textarea>
                            <div id="buildUrisDesc" class="form-text">
                                多个用逗号分割，例如：192.x.xx.xx:8000,192.xxx.xxx.xxx:8001
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveBuildBtn">确认</button>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/interactjs/dist/interact.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/bootstrap-table/dist/bootstrap-table.min.js}"></script>
<script th:src="@{/webjars/bootstrap-table/dist/locale/bootstrap-table-zh-CN.min.js}"></script>
<script th:src="@{/webjars/tom-select/dist/js/tom-select.complete.min.js}"></script>
<script th:src="@{/js/alatka-messages-infra.js}"></script>
<script th:src="@{/js/alatka-messages-table.js}"></script>
<script>
    initEnabledSelect();
    initTypeSelect();
    initKindSelect();
    initCharsetSelect();
    initTable();
    initTableRowEvent();

    function initTableRowEvent() {
        $('#dataTable').on('dbl-click-row.bs.table', function (event, row, $element) {
            redirectToFieldPage(row.id);
        });
    }

    function showBuildModal(url, type) {
        $('#buildPath').val('');
        $('#buildUris').val('');

        const $buildModal = $('#buildModal');
        $buildModal.find('.modal-title').text(type === 'fallback' ? '回退报文' : '部署报文');

        $buildModal.modal('show');
        $('#saveBuildBtn').off('click').on('click', function (event) {
            const formData = {};
            const $buildForm = $('#buildForm');
            if (!$buildForm[0].checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
                $buildForm.addClass('was-validated');
            } else {
                formData['path'] = $('#buildPath').val();
                formData['uris'] = $('#buildUris').val().split(",").map(item => item.trim());
                httpClient(url, 'POST', formData, function (data) {
                    showSuccessToast(JSON.stringify(data, null, 2));
                    $buildModal.modal('hide');
                });
            }
        });
    }

    function charsetFormatter(key) {
        switch (key) {
            case 'UTF-8':
                return `<span class="badge bg-primary">${key}</span>`;
            case 'GB18030':
                return `<span class="badge bg-success">${key}</span>`
            case 'GBK':
                return `<span class="badge bg-info">${key}</span>`
            default:
                return `<span class="badge bg-secondary">/</span>`;
        }
    }

    function initCharsetSelect() {
        $(".alk-select-charset").each(function () {
            let tomSelect = new TomSelect(this, {
                plugins: ['remove_button'],
                placeholder: '选择编码',
                options: [{value: 'UTF-8'}, {value: 'GB18030'}, {value: 'GBK'}],
                render: {
                    option: function (data, escape) {
                        return `<div>${charsetFormatter(data.value)}</div>`;
                    },
                    item: function (data, escape) {
                        return `<div>${charsetFormatter(data.value)}</div>`;
                    }
                }
            });
            if (this.id !== 'charset') {
                tomSelect.setValue([Object.keys(tomSelect.options)[0]]);
                $(this).data('alk-init-value', Object.keys(tomSelect.options)[0]);
            }
        });
    }

    function buttonsFunction() {
        return {
            fallbackBtn: {
                text: '回退',
                icon: 'bi-arrow-left',
                attributes: {
                    title: '回退',
                    class: 'btn btn-outline-secondary'
                },
                event: function () {
                    showBuildModal('/message/build', 'fallback');
                }
            },
            deployBtn: {
                text: '部署',
                icon: 'bi-rocket',
                attributes: {
                    title: '部署',
                    class: 'btn btn-outline-primary me-3'
                },
                event: function () {
                    showBuildModal('/message/build', 'deploy');
                }
            },
            addBtn: {
                text: '新增',
                icon: 'bi-plus-lg',
                attributes: {
                    title: '新增',
                    class: 'btn btn-outline-info'
                },
                event: function () {
                    showEditModal('/message/create', true);
                }
            },
            editBtn: {
                text: '更新',
                icon: 'bi-pencil-square',
                attributes: {
                    title: '更新',
                    class: 'btn btn-outline-warning'
                },
                event: function () {
                    showEditModal('/message/update', false);
                }
            },
            deleteBtn: {
                text: '删除',
                icon: 'bi-trash',
                attributes: {
                    title: '删除',
                    class: 'btn btn-danger me-3'
                },
                event: function () {
                    showDeleteModal('/message/delete');
                }
            }
        }
    }

    function buttonsOrderFunction() {
        return ['fallbackBtn', 'deployBtn', 'addBtn', 'editBtn', 'deleteBtn', 'columns'];
    }

</script>
</body>
</html>
